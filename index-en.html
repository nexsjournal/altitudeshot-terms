<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AltitudeNow - Legal Documents</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f5f5f7;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .lang-switch {
            text-align: right;
            margin-bottom: 20px;
            font-size: 15px;
        }

        .lang-switch a {
            color: #0071e3;
            text-decoration: none;
        }

        .lang-switch a:hover {
            text-decoration: underline;
        }
        
        header {
            text-align: center;
            margin-bottom: 60px;
        }
        
        h1 {
            font-size: 48px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 16px;
        }
        
        .subtitle {
            font-size: 21px;
            color: #6e6e73;
        }
        
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
        }
        
        .card {
            background: white;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }
        
        .card-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        .card h2 {
            font-size: 28px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 12px;
        }
        
        .card p {
            font-size: 17px;
            color: #6e6e73;
            line-height: 1.5;
        }
        
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #6e6e73;
            font-size: 14px;
        }
        
        footer a {
            color: #0071e3;
            text-decoration: none;
        }
        
        footer a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 36px;
            }
            
            .subtitle {
                font-size: 18px;
            }
            
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="lang-switch"><a href="index.html">中文</a> · English</p>

        <header>
            <h1>AltitudeNow</h1>
            <p class="subtitle">Legal Documents &amp; Privacy Policy</p>
        </header>
        
        <div class="cards">
            <a href="privacy-policy-en.html" class="card">
                <div class="card-icon">🔒</div>
                <h2>Privacy Policy</h2>
                <p>Learn how we collect, use, and protect your personal information</p>
            </a>
            
            <a href="terms-of-service-en.html" class="card">
                <div class="card-icon">📋</div>
                <h2>Terms of Service</h2>
                <p>Terms and conditions for using the AltitudeNow app</p>
            </a>
        </div>
        
        <footer>
            <p>Last updated: June 3, 2026</p>
            <p style="margin-top: 12px;">
                <a href="https://github.com/nexsjournal/altitudeshot-terms" target="_blank">GitHub Repository</a>
            </p>
        </footer>
    </div>
</body>
</html>
